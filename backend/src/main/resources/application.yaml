spring:
  application:
    name: itinerary-assistant
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tripplanner}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        embedding:
          # Authenticates the EmbeddingModel (SimpleVectorStore)
          api-key: ${GEMINI_API_KEY}