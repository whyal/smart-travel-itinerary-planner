spring:
  application:
    name: itinerary-assistant
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tripplanner}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        embedding:
          # Authenticates the EmbeddingModel (Google GenAI embedding)
          api-key: ${GEMINI_API_KEY}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${EMBEDDING_MODEL:qwen3-embedding:0.6b}
    openai:
      base-url: ${OPENAI_COMPAT_BASE_URL:http://localhost:8000}
      api-key: ${OPENAI_COMPAT_API_KEY:dummy-key}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:Qwen/Qwen3-Embedding-0.6B}
    vectorstore:
      pgvector:
        initialize-schema: true
        distance-type: COSINE_DISTANCE
        schema-name: public

app:
  vectorstore:
    type: ${VECTORSTORE_TYPE:pgvector} # Options: pgvector, simple
  embedding:
    # Active Provider: "google" (default), "ollama" (OSS local), "openai-compatible" (TEI / vLLM)
    provider: ${EMBEDDING_PROVIDER:google}
    model: ${EMBEDDING_MODEL:gemini-embedding-001}
    dimensions: ${EMBEDDING_DIMENSIONS:3072}
    table-name: ${EMBEDDING_TABLE_NAME:} # Optional override. When omitted, auto-routes to vector_store_{provider}_{dimensions}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    openai-compatible:
      base-url: ${OPENAI_COMPAT_BASE_URL:http://localhost:8000}
      api-key: ${OPENAI_COMPAT_API_KEY:dummy-key}